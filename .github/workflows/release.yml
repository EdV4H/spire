name: Release

on:
  push:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_NO_DAEMON: 1

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
          scope: "@edv4h"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm Trusted Publishing (OIDC): no long-lived NPM_TOKEN. Auth is a
      # short-lived GitHub OIDC token (see `permissions.id-token: write` above),
      # and npm attaches provenance automatically. Each package needs a Trusted
      # Publisher configured on npmjs.com pointing at this repo + workflow —
      # see docs/npm-publishing.md. `changeset publish` shells out to
      # `npm publish`, which needs npm >= 11.5.1 to detect the OIDC environment,
      # so upgrade the global npm here.
      - name: Ensure OIDC-capable npm
        run: npm install --global npm@latest

      - name: Create Release PR or Publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm release
          title: "🎉 release: Version Packages"
          commit: "🎉 release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN / NPM_TOKEN — npm authenticates via GitHub OIDC
          # (trusted publishing). A stale token here would be tried before OIDC.
